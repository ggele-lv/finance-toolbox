<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财务比率分析报告 - 财务工具箱</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='15' fill='%231a3c34'/><text x='50' y='68' font-size='45' text-anchor='middle' fill='%23c9a96e' font-family='monospace'>%</text></svg>">
<script src="https://fastly.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  :root {
    --primary: #1a3c34;
    --primary-light: #2d5a4f;
    --accent: #c9a96e;
    --bg: #f5f5f2;
    --surface: #ffffff;
    --border: #e0e0dc;
    --text: #2c2c2c;
    --text-secondary: #6b6b6b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  header {
    background: var(--primary);
    color: #fff;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  header h1 span { color: var(--accent); }
  .back-link {
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    opacity: 0.8;
  }
  .back-link:hover { opacity: 1; }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
  }

  .input-panel {
    background: var(--surface);
    border-radius: 8px;
    padding: 24px;
    border: 1px solid var(--border);
    height: fit-content;
    position: sticky;
    top: 24px;
  }
  .input-panel h2 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .input-panel .subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 20px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--primary);
    margin: 20px 0 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--accent);
  }
  .section-title:first-of-type { margin-top: 0; }

  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .form-group input,
  .form-group select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 14px;
    background: var(--bg);
    transition: border-color 0.15s;
  }
  .form-group input:focus,
  .form-group select:focus {
    outline: none;
    border-color: var(--primary-light);
    background: #fff;
  }

  .calc-btn {
    width: 100%;
    padding: 12px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 16px;
    transition: background 0.15s;
  }
  .calc-btn:hover { background: var(--primary-light); }

  .report-panel {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .report-header {
    background: var(--surface);
    border-radius: 8px;
    padding: 32px;
    border: 1px solid var(--border);
    text-align: center;
  }
  .report-header h2 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--primary);
  }
  .report-header .industry-tag {
    display: inline-block;
    padding: 4px 16px;
    background: #f8f4ea;
    color: var(--accent);
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 12px;
  }
  .report-header .date {
    font-size: 12px;
    color: var(--text-secondary);
  }

  .card {
    background: var(--surface);
    border-radius: 8px;
    padding: 24px;
    border: 1px solid var(--border);
  }
  .card h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  #radarChart {
    width: 100%;
    height: 320px;
  }

  .ratio-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .ratio-table th,
  .ratio-table td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .ratio-table th {
    background: #f8f8f5;
    font-weight: 600;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .ratio-table .value {
    font-weight: 600;
    font-family: "Consolas", monospace;
  }
  .status-badge {
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
  }
  .status-excellent { background: #e6f4ea; color: #1e7e34; }
  .status-good { background: #d4edda; color: #155724; }
  .status-average { background: #fff3cd; color: #856404; }
  .status-poor { background: #f8d7da; color: #721c24; }

  .analysis-section { margin-bottom: 20px; }
  .analysis-section h4 {
    font-size: 14px;
    font-weight: 600;
    color: var(--primary);
    margin-bottom: 8px;
  }
  .analysis-section p {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.8;
  }
  .analysis-section .highlight {
    color: var(--primary);
    font-weight: 500;
  }

  .score-card {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  .score-item {
    text-align: center;
    padding: 16px;
    background: #f8f8f5;
    border-radius: 8px;
  }
  .score-item .label {
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .score-item .score {
    font-size: 24px;
    font-weight: 700;
    color: var(--primary);
  }
  .score-item .level {
    font-size: 11px;
    color: var(--accent);
    margin-top: 2px;
  }

  footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .input-panel { position: static; }
    .score-card { grid-template-columns: repeat(2, 1fr); }
    .form-group input,
    .form-group select { font-size: 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>财务比率<span>分析报告</span></h1>
  <a href="index.html" class="back-link">← 返回工具箱</a>
</header>

<div class="container">
  <div class="layout">

    <aside class="input-panel">
      <h2>输入财务数据</h2>
      <p class="subtitle">单位：万元，选择行业后自动对标</p>

      <div class="section-title">企业信息</div>
      <div class="form-group">
        <label>所属行业</label>
        <select id="industry">
          <option value="manufacturing">工业/制造业</option>
          <option value="commercial">商业/批发零售</option>
          <option value="realestate">房地产业</option>
          <option value="construction">建筑业</option>
          <option value="service">服务业</option>
          <option value="it">信息技术业</option>
        </select>
      </div>

      <div class="section-title">资产负债表</div>
      <div class="form-group">
        <label>流动资产合计</label>
        <input type="number" id="currentAssets" value="5000" step="0.01">
      </div>
      <div class="form-group">
        <label>存货</label>
        <input type="number" id="inventory" value="1500" step="0.01">
      </div>
      <div class="form-group">
        <label>应收账款</label>
        <input type="number" id="accountsReceivable" value="800" step="0.01">
      </div>
      <div class="form-group">
        <label>流动负债合计</label>
        <input type="number" id="currentLiabilities" value="3000" step="0.01">
      </div>
      <div class="form-group">
        <label>资产总计</label>
        <input type="number" id="totalAssets" value="12000" step="0.01">
      </div>
      <div class="form-group">
        <label>负债总计</label>
        <input type="number" id="totalLiabilities" value="6000" step="0.01">
      </div>
      <div class="form-group">
        <label>所有者权益合计</label>
        <input type="number" id="totalEquity" value="6000" step="0.01">
      </div>

      <div class="section-title">利润表</div>
      <div class="form-group">
        <label>营业收入</label>
        <input type="number" id="revenue" value="8000" step="0.01">
      </div>
      <div class="form-group">
        <label>营业成本</label>
        <input type="number" id="cogs" value="5200" step="0.01">
      </div>
      <div class="form-group">
        <label>净利润</label>
        <input type="number" id="netProfit" value="800" step="0.01">
      </div>

      <button class="calc-btn" onclick="generateReport()">生成分析报告</button>
    </aside>

    <main class="report-panel" id="reportPanel">

      <div class="report-header">
        <div class="industry-tag" id="reportIndustry">工业/制造业</div>
        <h2>财务比率分析报告</h2>
        <div class="date" id="reportDate"></div>
      </div>

      <div class="score-card" id="scoreCard"></div>

      <div class="card">
        <h3>财务能力雷达图（与行业对标）</h3>
        <div id="radarChart"></div>
      </div>

      <div class="card">
        <h3>核心财务比率明细表</h3>
        <table class="ratio-table">
          <thead>
            <tr>
              <th>指标</th>
              <th>企业值</th>
              <th>行业均值</th>
              <th>行业优秀值</th>
              <th>评价</th>
            </tr>
          </thead>
          <tbody id="ratioTableBody"></tbody>
        </table>
      </div>

      <div class="card">
        <h3>详细分析</h3>
        <div id="analysisContent"></div>
      </div>

    </main>

  </div>
</div>

<footer>
  行业对标数据参考国资委《企业绩效评价标准值》整理 · 仅供参考，不构成投资建议
</footer>

<script>
const INDUSTRY_DATA = {
  manufacturing: {
    name: '工业/制造业',
    avg: { currentRatio: 1.5, quickRatio: 0.9, debtRatio: 60, grossMargin: 20, netMargin: 5, roe: 8, assetTurnover: 0.8 },
    excellent: { currentRatio: 2.5, quickRatio: 1.5, debtRatio: 45, grossMargin: 30, netMargin: 10, roe: 15, assetTurnover: 1.2 }
  },
  commercial: {
    name: '商业/批发零售',
    avg: { currentRatio: 1.2, quickRatio: 0.6, debtRatio: 65, grossMargin: 12, netMargin: 2.5, roe: 7, assetTurnover: 1.5 },
    excellent: { currentRatio: 1.8, quickRatio: 1.0, debtRatio: 50, grossMargin: 20, netMargin: 5, roe: 12, assetTurnover: 2.5 }
  },
  realestate: {
    name: '房地产业',
    avg: { currentRatio: 1.5, quickRatio: 0.4, debtRatio: 75, grossMargin: 30, netMargin: 8, roe: 10, assetTurnover: 0.3 },
    excellent: { currentRatio: 2.5, quickRatio: 0.8, debtRatio: 60, grossMargin: 40, netMargin: 15, roe: 18, assetTurnover: 0.5 }
  },
  construction: {
    name: '建筑业',
    avg: { currentRatio: 1.2, quickRatio: 0.8, debtRatio: 70, grossMargin: 10, netMargin: 2, roe: 6, assetTurnover: 0.7 },
    excellent: { currentRatio: 1.8, quickRatio: 1.2, debtRatio: 55, grossMargin: 15, netMargin: 4, roe: 10, assetTurnover: 1.0 }
  },
  service: {
    name: '服务业',
    avg: { currentRatio: 1.5, quickRatio: 1.2, debtRatio: 50, grossMargin: 35, netMargin: 8, roe: 9, assetTurnover: 0.6 },
    excellent: { currentRatio: 2.5, quickRatio: 2.0, debtRatio: 35, grossMargin: 50, netMargin: 15, roe: 15, assetTurnover: 1.0 }
  },
  it: {
    name: '信息技术业',
    avg: { currentRatio: 2.5, quickRatio: 2.0, debtRatio: 40, grossMargin: 40, netMargin: 10, roe: 10, assetTurnover: 0.5 },
    excellent: { currentRatio: 4.0, quickRatio: 3.5, debtRatio: 25, grossMargin: 60, netMargin: 20, roe: 20, assetTurnover: 1.0 }
  }
};

let chart = null;

function getVal(id) {
  const v = parseFloat(document.getElementById(id).value);
  return isNaN(v) ? 0 : v;
}

function getStatus(value, avg, excellent, higher = true) {
  if (higher) {
    if (value >= excellent) return { cls: 'status-excellent', text: '优秀', score: 90 };
    if (value >= avg * 1.1) return { cls: 'status-good', text: '良好', score: 75 };
    if (value >= avg * 0.9) return { cls: 'status-average', text: '平均', score: 60 };
    return { cls: 'status-poor', text: '偏弱', score: 40 };
  } else {
    if (value <= excellent) return { cls: 'status-excellent', text: '优秀', score: 90 };
    if (value <= avg * 0.9) return { cls: 'status-good', text: '良好', score: 75 };
    if (value <= avg * 1.1) return { cls: 'status-average', text: '平均', score: 60 };
    return { cls: 'status-poor', text: '偏高', score: 40 };
  }
}

function generateReport() {
  const industryKey = document.getElementById('industry').value;
  const industry = INDUSTRY_DATA[industryKey];

  const currentAssets = getVal('currentAssets');
  const inventory = getVal('inventory');
  const currentLiabilities = getVal('currentLiabilities');
  const totalAssets = getVal('totalAssets');
  const totalLiabilities = getVal('totalLiabilities');
  const totalEquity = getVal('totalEquity');
  const revenue = getVal('revenue');
  const cogs = getVal('cogs');
  const netProfit = getVal('netProfit');

  const ratios = {
    currentRatio: currentLiabilities > 0 ? currentAssets / currentLiabilities : 0,
    quickRatio: currentLiabilities > 0 ? (currentAssets - inventory) / currentLiabilities : 0,
    debtRatio: totalAssets > 0 ? totalLiabilities / totalAssets * 100 : 0,
    grossMargin: revenue > 0 ? (revenue - cogs) / revenue * 100 : 0,
    netMargin: revenue > 0 ? netProfit / revenue * 100 : 0,
    roe: totalEquity > 0 ? netProfit / totalEquity * 100 : 0,
    assetTurnover: totalAssets > 0 ? revenue / totalAssets : 0,
  };

  const evaluations = {
    currentRatio: getStatus(ratios.currentRatio, industry.avg.currentRatio, industry.excellent.currentRatio),
    quickRatio: getStatus(ratios.quickRatio, industry.avg.quickRatio, industry.excellent.quickRatio),
    debtRatio: getStatus(ratios.debtRatio, industry.avg.debtRatio, industry.excellent.debtRatio, false),
    grossMargin: getStatus(ratios.grossMargin, industry.avg.grossMargin, industry.excellent.grossMargin),
    netMargin: getStatus(ratios.netMargin, industry.avg.netMargin, industry.excellent.netMargin),
    roe: getStatus(ratios.roe, industry.avg.roe, industry.excellent.roe),
    assetTurnover: getStatus(ratios.assetTurnover, industry.avg.assetTurnover, industry.excellent.assetTurnover),
  };

  const totalScore = Math.round(
    (evaluations.currentRatio.score + evaluations.quickRatio.score + evaluations.debtRatio.score +
     evaluations.grossMargin.score + evaluations.netMargin.score + evaluations.roe.score + evaluations.assetTurnover.score) / 7
  );
  const overallLevel = totalScore >= 85 ? '优秀' : totalScore >= 70 ? '良好' : totalScore >= 55 ? '一般' : '偏弱';

  document.getElementById('reportIndustry').textContent = industry.name;
  document.getElementById('reportDate').textContent = '报告生成日期：' + new Date().toLocaleDateString('zh-CN');

  const solvencyScore = Math.round((evaluations.currentRatio.score + evaluations.quickRatio.score + evaluations.debtRatio.score) / 3);
  const profitabilityScore = Math.round((evaluations.grossMargin.score + evaluations.netMargin.score + evaluations.roe.score) / 3);
  const operationScore = evaluations.assetTurnover.score;

  document.getElementById('scoreCard').innerHTML = `
    <div class="score-item">
      <div class="label">综合评分</div>
      <div class="score">${totalScore}</div>
      <div class="level">${overallLevel}</div>
    </div>
    <div class="score-item">
      <div class="label">偿债能力</div>
      <div class="score">${solvencyScore}</div>
      <div class="level">${solvencyScore >= 75 ? '良好' : solvencyScore >= 60 ? '一般' : '偏弱'}</div>
    </div>
    <div class="score-item">
      <div class="label">盈利能力</div>
      <div class="score">${profitabilityScore}</div>
      <div class="level">${profitabilityScore >= 75 ? '良好' : profitabilityScore >= 60 ? '一般' : '偏弱'}</div>
    </div>
    <div class="score-item">
      <div class="label">营运能力</div>
      <div class="score">${operationScore}</div>
      <div class="level">${operationScore >= 75 ? '良好' : operationScore >= 60 ? '一般' : '偏弱'}</div>
    </div>
  `;

  renderRadar(ratios, industry);

  const ratioNames = {
    currentRatio: '流动比率',
    quickRatio: '速动比率',
    debtRatio: '资产负债率(%)',
    grossMargin: '毛利率(%)',
    netMargin: '净利率(%)',
    roe: '净资产收益率(%)',
    assetTurnover: '总资产周转率',
  };

  let tableHtml = '';
  for (const key in ratios) {
    const e = evaluations[key];
    tableHtml += `
      <tr>
        <td>${ratioNames[key]}</td>
        <td class="value">${ratios[key].toFixed(2)}</td>
        <td>${industry.avg[key].toFixed(2)}</td>
        <td>${industry.excellent[key].toFixed(2)}</td>
        <td><span class="status-badge ${e.cls}">${e.text}</span></td>
      </tr>
    `;
  }
  document.getElementById('ratioTableBody').innerHTML = tableHtml;

  generateAnalysis(ratios, evaluations, industry, totalScore, overallLevel);
}

function renderRadar(ratios, industry) {
  if (!chart) {
    chart = echarts.init(document.getElementById('radarChart'));
  }
  chart.setOption({
    tooltip: { trigger: 'item' },
    legend: {
      data: ['本企业', '行业平均', '行业优秀'],
      bottom: 0,
      textStyle: { fontSize: 12 }
    },
    radar: {
      indicator: [
        { name: '流动比率', max: 100 },
        { name: '速动比率', max: 100 },
        { name: '偿债能力', max: 100 },
        { name: '毛利率', max: 100 },
        { name: '净利率', max: 100 },
        { name: 'ROE', max: 100 },
        { name: '营运能力', max: 100 },
      ],
      shape: 'polygon',
      splitArea: { areaStyle: { color: ['#f8f8f5', '#f0f0ec'] } },
      axisName: { color: '#6b6b6b', fontSize: 12 }
    },
    series: [{
      type: 'radar',
      data: [
        {
          value: normalizeRatios(ratios),
          name: '本企业',
          areaStyle: { color: 'rgba(26, 60, 52, 0.3)' },
          lineStyle: { color: '#1a3c34', width: 2 },
          itemStyle: { color: '#1a3c34' }
        },
        {
          value: normalizeIndustry(industry.avg),
          name: '行业平均',
          lineStyle: { color: '#c9a96e', width: 1, type: 'dashed' },
          itemStyle: { color: '#c9a96e' }
        },
        {
          value: normalizeIndustry(industry.excellent),
          name: '行业优秀',
          lineStyle: { color: '#3a7d44', width: 1, type: 'dotted' },
          itemStyle: { color: '#3a7d44' }
        }
      ]
    }]
  });
}

function normalizeRatios(r) {
  return [
    Math.min(100, r.currentRatio * 30),
    Math.min(100, r.quickRatio * 40),
    Math.max(0, 100 - r.debtRatio),
    Math.min(100, r.grossMargin * 2),
    Math.min(100, r.netMargin * 8),
    Math.min(100, r.roe * 5),
    Math.min(100, r.assetTurnover * 60),
  ];
}

function normalizeIndustry(r) {
  return [
    Math.min(100, r.currentRatio * 30),
    Math.min(100, r.quickRatio * 40),
    Math.max(0, 100 - r.debtRatio),
    Math.min(100, r.grossMargin * 2),
    Math.min(100, r.netMargin * 8),
    Math.min(100, r.roe * 5),
    Math.min(100, r.assetTurnover * 60),
  ];
}

function generateAnalysis(r, ev, industry, totalScore, level) {
  let html = '';

  html += `
    <div class="analysis-section">
      <h4>一、偿债能力分析</h4>
      <p>
        企业流动比率为 <span class="highlight">${r.currentRatio.toFixed(2)}</span>，行业平均水平为 ${industry.avg.currentRatio.toFixed(2)}，
        ${ev.currentRatio.text === '优秀' || ev.currentRatio.text === '良好' ? '处于行业较好水平，短期偿债风险较低。' : ev.currentRatio.text === '平均' ? '处于行业平均水平，短期偿债能力基本合理。' : '低于行业平均水平，需关注短期流动性风险。'}
        资产负债率为 <span class="highlight">${r.debtRatio.toFixed(1)}%</span>，行业平均 ${industry.avg.debtRatio.toFixed(1)}%，
        ${ev.debtRatio.text === '优秀' || ev.debtRatio.text === '良好' ? '财务结构稳健，长期偿债压力小。' : ev.debtRatio.text === '平均' ? '负债水平处于行业正常区间。' : '负债水平偏高，财务杠杆风险需关注。'}
      </p>
    </div>
  `;

  html += `
    <div class="analysis-section">
      <h4>二、盈利能力分析</h4>
      <p>
        毛利率为 <span class="highlight">${r.grossMargin.toFixed(1)}%</span>，行业平均 ${industry.avg.grossMargin.toFixed(1)}%，
        ${ev.grossMargin.text === '优秀' ? '产品竞争力强，定价能力突出。' : ev.grossMargin.text === '良好' ? '产品盈利性较好，高于行业平均。' : ev.grossMargin.text === '平均' ? '毛利率处于行业平均水平。' : '毛利率偏低，成本控制或产品定价存在压力。'}
        净资产收益率（ROE）为 <span class="highlight">${r.roe.toFixed(1)}%</span>，行业优秀值 ${industry.excellent.roe.toFixed(1)}%，
        ${ev.roe.text === '优秀' ? '股东回报水平优秀，资本运作效率高。' : ev.roe.text === '良好' ? '股东回报高于行业平均水平。' : ev.roe.text === '平均' ? '股东回报处于行业正常水平。' : '股东回报偏低，需提升盈利效率。'}
      </p>
    </div>
  `;

  html += `
    <div class="analysis-section">
      <h4>三、营运能力分析</h4>
      <p>
        总资产周转率为 <span class="highlight">${r.assetTurnover.toFixed(2)}</span> 次，行业平均 ${industry.avg.assetTurnover.toFixed(2)} 次，
        ${ev.assetTurnover.text === '优秀' ? '资产使用效率高，营运能力突出。' : ev.assetTurnover.text === '良好' ? '资产周转效率高于行业平均。' : ev.assetTurnover.text === '平均' ? '资产周转处于行业正常水平。' : '资产周转效率偏低，需提升运营效率。'}
      </p>
    </div>
  `;

  html += `
    <div class="analysis-section">
      <h4>四、综合评价与建议</h4>
      <p>
        综合评分 <span class="highlight">${totalScore}分</span>，整体评价为 <span class="highlight">${level}</span>。
        从 ${industry.name} 行业对标来看，企业整体财务状况${level === '优秀' ? '表现优异，各项指标均处于行业较好水平' : level === '良好' ? '表现良好，部分指标优于行业平均' : level === '一般' ? '处于行业平均水平，仍有提升空间' : '各项指标偏弱，需重点改善'}。
        建议重点关注${ev.currentRatio.text === '偏弱' || ev.debtRatio.text === '偏高' ? '偿债能力和负债结构' : ev.roe.text === '偏弱' ? '盈利能力和股东回报' : '营运效率'}，
        通过优化资产结构、提升运营效率，进一步改善财务表现。
      </p>
      <p style="margin-top: 12px; font-size: 11px; color: #999;">
        注：行业对标数据参考国资委《企业绩效评价标准值》整理，不同规模、不同细分领域企业差异较大，本报告仅供参考。
      </p>
    </div>
  `;

  document.getElementById('analysisContent').innerHTML = html;
}

generateReport();

window.addEventListener('resize', () => {
  if (chart) chart.resize();
});
</script>

</body>
</html>
