<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财务比率分析仪表盘</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='15' fill='%231a3c34'/><text x='50' y='68' font-size='45' text-anchor='middle' fill='%23c9a96e' font-family='monospace'>%</text></svg>">
<script src="https://fastly.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  :root {
    --primary: #1a3c34;
    --primary-light: #2d5a4f;
    --accent: #c9a96e;
    --bg: #f5f5f2;
    --surface: #ffffff;
    --border: #e0e0dc;
    --text: #2c2c2c;
    --text-secondary: #6b6b6b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  header {
    background: var(--primary);
    color: #fff;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  header h1 span { color: var(--accent); }
  .privacy-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    opacity: 0.9;
  }
  .privacy-badge .dot {
    width: 8px; height: 8px;
    background: #6fd47e;
    border-radius: 50%;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 24px;
  }

  /* ===== 输入面板 ===== */
  .input-panel {
    background: var(--surface);
    border-radius: 8px;
    padding: 24px;
    border: 1px solid var(--border);
  }
  .input-panel h2 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .input-panel .subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 20px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--primary);
    margin: 20px 0 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--accent);
  }
  .section-title:first-of-type { margin-top: 0; }

  .form-group {
    margin-bottom: 12px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .form-group input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 14px;
    background: var(--bg);
    transition: border-color 0.15s;
  }
  .form-group input:focus {
    outline: none;
    border-color: var(--primary-light);
    background: #fff;
  }

  .calc-btn {
    width: 100%;
    padding: 12px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 16px;
    transition: background 0.15s;
  }
  .calc-btn:hover { background: var(--primary-light); }

  /* ===== 结果面板 ===== */
  .result-panel {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .chart-card {
    background: var(--surface);
    border-radius: 8px;
    padding: 24px;
    border: 1px solid var(--border);
  }
  .chart-card h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  #radarChart {
    width: 100%;
    height: 360px;
  }

  .ratio-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .ratio-card {
    background: var(--surface);
    border-radius: 8px;
    padding: 20px;
    border: 1px solid var(--border);
    text-align: center;
  }
  .ratio-card .label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .ratio-card .value {
    font-size: 24px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 4px;
  }
  .ratio-card .status {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    display: inline-block;
  }
  .status-good { background: #e6f4ea; color: #1e7e34; }
  .status-warn { background: #fff3cd; color: #856404; }
  .status-bad { background: #f8d7da; color: #721c24; }

  .analysis-card {
    background: var(--surface);
    border-radius: 8px;
    padding: 24px;
    border: 1px solid var(--border);
  }
  .analysis-card h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .analysis-card p {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.8;
  }

  footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* ===== 响应式 ===== */
  @media (max-width: 900px) {
    .layout {
      grid-template-columns: 1fr;
    }
    .ratio-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .form-group input {
      font-size: 16px;
    }
  }
</style>
</head>
<body>

<header>
  <h1>财务比率<span>分析仪表盘</span></h1>
  <div class="privacy-badge">
    <div class="dot"></div>
    数据全程本地处理 · 不出域
  </div>
</header>

<div class="container">
  <div class="layout">

    <!-- 左侧输入区 -->
    <aside class="input-panel">
      <h2>输入财务数据</h2>
      <p class="subtitle">单位：万元，输入后自动计算</p>

      <div class="section-title">资产负债表</div>

      <div class="form-group">
        <label>流动资产合计</label>
        <input type="number" id="currentAssets" value="5000" step="0.01">
      </div>
      <div class="form-group">
        <label>存货</label>
        <input type="number" id="inventory" value="1500" step="0.01">
      </div>
      <div class="form-group">
        <label>应收账款</label>
        <input type="number" id="accountsReceivable" value="800" step="0.01">
      </div>
      <div class="form-group">
        <label>流动负债合计</label>
        <input type="number" id="currentLiabilities" value="3000" step="0.01">
      </div>
      <div class="form-group">
        <label>资产总计</label>
        <input type="number" id="totalAssets" value="12000" step="0.01">
      </div>
      <div class="form-group">
        <label>负债总计</label>
        <input type="number" id="totalLiabilities" value="6000" step="0.01">
      </div>
      <div class="form-group">
        <label>所有者权益合计</label>
        <input type="number" id="totalEquity" value="6000" step="0.01">
      </div>

      <div class="section-title">利润表</div>

      <div class="form-group">
        <label>营业收入</label>
        <input type="number" id="revenue" value="8000" step="0.01">
      </div>
      <div class="form-group">
        <label>营业成本</label>
        <input type="number" id="cogs" value="5200" step="0.01">
      </div>
      <div class="form-group">
        <label>净利润</label>
        <input type="number" id="netProfit" value="800" step="0.01">
      </div>

      <button class="calc-btn" onclick="calculate()">计算分析</button>
    </aside>

    <!-- 右侧结果区 -->
    <main class="result-panel">

      <div class="chart-card">
        <h3>财务能力雷达图</h3>
        <div id="radarChart"></div>
      </div>

      <div class="ratio-grid" id="ratioGrid">
        <!-- 动态生成 -->
      </div>

      <div class="analysis-card">
        <h3>综合分析结论</h3>
        <p id="analysisText">输入数据后点击「计算分析」，自动生成综合财务分析结论。</p>
      </div>

    </main>

  </div>
</div>

<footer>
  适用于财务分析、审计尽调场景 · 所有计算均在浏览器本地完成
</footer>

<script>
let chart = null;

function getVal(id) {
  const v = parseFloat(document.getElementById(id).value);
  return isNaN(v) ? 0 : v;
}

function calculate() {
  // 读取数据
  const currentAssets = getVal('currentAssets');
  const inventory = getVal('inventory');
  const accountsReceivable = getVal('accountsReceivable');
  const currentLiabilities = getVal('currentLiabilities');
  const totalAssets = getVal('totalAssets');
  const totalLiabilities = getVal('totalLiabilities');
  const totalEquity = getVal('totalEquity');
  const revenue = getVal('revenue');
  const cogs = getVal('cogs');
  const netProfit = getVal('netProfit');

  // 计算比率
  const currentRatio = currentLiabilities > 0 ? (currentAssets / currentLiabilities) : 0;
  const quickRatio = currentLiabilities > 0 ? ((currentAssets - inventory) / currentLiabilities) : 0;
  const debtRatio = totalAssets > 0 ? (totalLiabilities / totalAssets * 100) : 0;
  const grossMargin = revenue > 0 ? ((revenue - cogs) / revenue * 100) : 0;
  const netMargin = revenue > 0 ? (netProfit / revenue * 100) : 0;
  const roe = totalEquity > 0 ? (netProfit / totalEquity * 100) : 0;
  const assetTurnover = totalAssets > 0 ? (revenue / totalAssets) : 0;

  // 状态判断
  function getStatus(value, thresholds, higher = true) {
    // thresholds: [good, warn] 例如 [2, 1] 表示 >=2 好，>=1 一般，否则差
    if (higher) {
      if (value >= thresholds[0]) return { cls: 'status-good', text: '良好' };
      if (value >= thresholds[1]) return { cls: 'status-warn', text: '一般' };
      return { cls: 'status-bad', text: '偏弱' };
    } else {
      if (value <= thresholds[0]) return { cls: 'status-good', text: '良好' };
      if (value <= thresholds[1]) return { cls: 'status-warn', text: '一般' };
      return { cls: 'status-bad', text: '偏高' };
    }
  }

  const ratios = [
    { label: '流动比率', value: currentRatio.toFixed(2), unit: '', status: getStatus(currentRatio, [2, 1]) },
    { label: '速动比率', value: quickRatio.toFixed(2), unit: '', status: getStatus(quickRatio, [1, 0.5]) },
    { label: '资产负债率', value: debtRatio.toFixed(1), unit: '%', status: getStatus(debtRatio, [50, 70], false) },
    { label: '毛利率', value: grossMargin.toFixed(1), unit: '%', status: getStatus(grossMargin, [30, 15]) },
    { label: '净利率', value: netMargin.toFixed(1), unit: '%', status: getStatus(netMargin, [10, 5]) },
    { label: 'ROE', value: roe.toFixed(1), unit: '%', status: getStatus(roe, [15, 8]) },
    { label: '总资产周转率', value: assetTurnover.toFixed(2), unit: '', status: getStatus(assetTurnover, [1, 0.5]) },
  ];

  // 渲染比率卡片
  const grid = document.getElementById('ratioGrid');
  grid.innerHTML = ratios.map(r => `
    <div class="ratio-card">
      <div class="label">${r.label}</div>
      <div class="value">${r.value}${r.unit}</div>
      <span class="status ${r.status.cls}">${r.status.text}</span>
    </div>
  `).join('');

  // 雷达图（标准化到0-100）
  const radarData = [
    Math.min(100, currentRatio * 40),        // 偿债能力-流动比率
    Math.min(100, quickRatio * 60),          // 偿债能力-速动比率
    Math.max(0, 100 - debtRatio * 1.2),    // 偿债能力-资产负债率(反向)
    Math.min(100, grossMargin * 2.5),       // 盈利能力-毛利率
    Math.min(100, netMargin * 8),           // 盈利能力-净利率
    Math.min(100, roe * 4),                 // 盈利能力-ROE
    Math.min(100, assetTurnover * 80),      // 营运能力-总资产周转率
  ];

  renderRadar(radarData);

  // 综合分析
  generateAnalysis({ currentRatio, quickRatio, debtRatio, grossMargin, netMargin, roe });
}

function renderRadar(data) {
  if (!chart) {
    chart = echarts.init(document.getElementById('radarChart'));
  }
  chart.setOption({
    tooltip: { trigger: 'item' },
    radar: {
      indicator: [
        { name: '流动比率', max: 100 },
        { name: '速动比率', max: 100 },
        { name: '偿债能力', max: 100 },
        { name: '毛利率', max: 100 },
        { name: '净利率', max: 100 },
        { name: 'ROE', max: 100 },
        { name: '营运能力', max: 100 },
      ],
      shape: 'polygon',
      splitArea: {
        areaStyle: { color: ['#f8f8f5', '#f0f0ec'] }
      },
      axisName: {
        color: '#6b6b6b',
        fontSize: 12
      }
    },
    series: [{
      type: 'radar',
      data: [{
        value: data,
        name: '财务能力',
        areaStyle: { color: 'rgba(26, 60, 52, 0.2)' },
        lineStyle: { color: '#1a3c34', width: 2 },
        itemStyle: { color: '#c9a96e' }
      }]
    }]
  });
}

function generateAnalysis(r) {
  const points = [];

  // 偿债能力
  if (r.currentRatio >= 2 && r.quickRatio >= 1) {
    points.push('偿债能力较强，流动比率和速动比率均处于健康水平，短期偿债风险低。');
  } else if (r.currentRatio < 1) {
    points.push('短期偿债能力偏弱，流动比率低于1，需关注流动性风险。');
  } else {
    points.push('偿债能力一般，流动比率处于行业平均水平，需结合行业特征进一步判断。');
  }

  if (r.debtRatio > 70) {
    points.push('资产负债率偏高（' + r.debtRatio.toFixed(1) + '%），长期偿债压力较大，财务杠杆风险需关注。');
  } else if (r.debtRatio < 40) {
    points.push('资产负债率较低（' + r.debtRatio.toFixed(1) + '%），财务结构稳健，但可能未充分利用杠杆效应。');
  }

  // 盈利能力
  if (r.grossMargin >= 30) {
    points.push('毛利率水平较高（' + r.grossMargin.toFixed(1) + '%），产品或服务有较强的定价能力和成本优势。');
  } else if (r.grossMargin < 15) {
    points.push('毛利率偏低（' + r.grossMargin.toFixed(1) + '%），产品竞争力或成本控制存在压力。');
  }

  if (r.netMargin >= 10) {
    points.push('净利率表现良好（' + r.netMargin.toFixed(1) + '%），费用控制能力较强。');
  } else if (r.netMargin < 3) {
    points.push('净利率偏低（' + r.netMargin.toFixed(1) + '%），需关注期间费用控制。');
  }

  if (r.roe >= 15) {
    points.push('ROE达到' + r.roe.toFixed(1) + '%，股东回报水平优秀。');
  }

  document.getElementById('analysisText').innerHTML = points.join('<br><br>') +
    '<br><br><span style="color:#999;font-size:11px;">注：以上分析基于通用财务比率标准，不同行业、不同规模企业的合理区间差异较大，仅供参考。</span>';
}

// 初始化
calculate();

window.addEventListener('resize', () => {
  if (chart) chart.resize();
});
</script>

</body>
</html>
