<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel公式生成器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='15' fill='%2360a5fa'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='%23ffffff' font-family='monospace'>fx</text></svg>">
<style>
  :root {
    --primary: #3b82f6;
    --primary-light: #93c5fd;
    --accent: #60a5fa;
    --bg: #f0f9ff;
    --surface: #ffffff;
    --border: #e0f2fe;
    --text: #0c4a6e;
    --text-secondary: #64748b;
    --code-bg: #1e293b;
    --code-text: #e2e8f0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  /* ===== 顶部 ===== */
  header {
    background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
    color: var(--text);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #0c4a6e;
  }
  header h1 span { color: #3b82f6; }
  .privacy-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #0c4a6e;
    opacity: 0.8;
  }
  .privacy-badge .dot {
    width: 8px; height: 8px;
    background: #6fd47e;
    border-radius: 50%;
  }

  /* ===== 主工作区 ===== */
  .workspace {
    display: grid;
    grid-template-columns: 220px 1fr 1fr;
    gap: 0;
    min-height: calc(100vh - 64px);
  }

  /* ===== 左侧场景选择 ===== */
  .scene-panel {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px 0;
  }
  .scene-panel .panel-title {
    padding: 0 20px 12px;
    font-size: 12px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .search-box {
    padding: 0 20px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .search-box input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    background: #f8fafc;
  }
  .search-box input:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
  }
  .scene-item {
    padding: 14px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.15s;
  }
  .scene-item:hover { background: #f0f9ff; }
  .scene-item.active {
    border-left-color: var(--primary);
    background: #eff6ff;
  }
  .scene-item .name {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 2px;
  }
  .scene-item .desc {
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* 示例弹窗 */
  .example-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .example-modal.show { display: flex; }
  .example-content {
    background: #fff;
    border-radius: 10px;
    padding: 28px;
    max-width: 600px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .example-content h3 {
    font-size: 17px;
    margin-bottom: 16px;
    color: var(--text);
  }
  .example-content .example-block {
    margin-bottom: 16px;
    padding: 12px;
    background: #f8fafc;
    border-radius: 6px;
    font-size: 13px;
  }
  .example-content .example-block strong {
    display: block;
    margin-bottom: 6px;
    color: var(--primary);
  }
  .example-content pre {
    background: #1e293b;
    color: #e2e8f0;
    padding: 12px;
    border-radius: 6px;
    font-size: 12px;
    overflow-x: auto;
    white-space: pre-wrap;
  }
  .close-modal {
    margin-top: 12px;
    padding: 8px 24px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }

  .download-btn {
    padding: 6px 14px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text);
  }
  .download-btn:hover {
    border-color: var(--accent);
    color: var(--primary);
  }

  /* ===== 中间参数区 ===== */
  .param-panel {
    padding: 28px 32px;
    background: var(--bg);
    border-right: 1px solid var(--border);
    overflow-y: auto;
  }
  .param-panel h2 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .param-panel .scene-desc {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
    color: var(--text);
  }
  .form-group label .hint {
    font-weight: 400;
    color: var(--text-secondary);
    font-size: 12px;
    margin-left: 6px;
  }
  .form-group input,
  .form-group select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 14px;
    background: var(--surface);
    transition: border-color 0.15s;
  }
  .form-group input:focus,
  .form-group select:focus {
    outline: none;
    border-color: var(--primary-light);
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .generate-btn {
    width: 100%;
    padding: 12px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s;
  }
  .generate-btn:hover { background: var(--primary-light); }

  /* ===== 右侧代码区 ===== */
  .code-panel {
    padding: 28px 32px;
    background: var(--code-bg);
    display: flex;
    flex-direction: column;
  }
  .code-panel .code-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .code-panel .code-title {
    color: #888;
    font-size: 12px;
    font-family: "Consolas", monospace;
  }
  .copy-btn {
    padding: 6px 16px;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .copy-btn:hover { background: rgba(201,169,110,0.1); }
  .copy-btn.copied {
    background: var(--accent);
    color: #fff;
  }
  .code-area {
    flex: 1;
    background: transparent;
    color: var(--code-text);
    font-family: "Consolas", "Courier New", monospace;
    font-size: 14px;
    line-height: 1.8;
    white-space: pre;
    overflow: auto;
    min-height: 400px;
  }
  .code-placeholder {
    color: #555;
    font-style: italic;
  }
  .formula-explain {
    margin-top: 16px;
    padding: 12px 16px;
    background: rgba(201,169,110,0.08);
    border-left: 3px solid var(--accent);
    color: #aaa;
    font-size: 12px;
    line-height: 1.6;
  }

  /* ===== 底部 ===== */
  footer {
    text-align: center;
    padding: 16px;
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--surface);
    border-top: 1px solid var(--border);
  }

  /* ===== 响应式 ===== */
  @media (max-width: 1024px) {
    .workspace {
      grid-template-columns: 1fr;
    }
    .scene-panel {
      border-right: none;
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
    }
    .scene-panel .panel-title { display: none; }
    .scene-item {
      display: inline-block;
      width: auto;
      border-left: none;
      border-bottom: 3px solid transparent;
      margin-right: 4px;
    }
    .scene-item.active {
      border-left: none;
      border-bottom-color: var(--accent);
    }
    .param-panel { border-right: none; }
    .code-panel { min-height: 300px; }
    .form-group input,
    .form-group select {
      font-size: 16px;
    }
  }
</style>
</head>
<body>

<header>
  <h1>Excel公式<span>生成器</span></h1>
  <div class="privacy-badge">
    <div class="dot"></div>
    数据全程本地处理 · 不出域
  </div>
</header>

<div class="workspace">

  <!-- 左侧场景选择 -->
  <aside class="scene-panel">
    <div class="panel-title">公式列表</div>
    <div class="search-box">
      <input type="text" id="sceneSearch" placeholder="搜索公式，如：查找、条件..." oninput="renderSceneList()">
    </div>
    <div id="sceneList"></div>
  </aside>

  <!-- 中间参数表单 -->
  <section class="param-panel">
    <h2 id="sceneName"></h2>
    <p class="scene-desc" id="sceneDesc"></p>
    <div id="paramForm"></div>
    <div style="display:flex;gap:12px;">
      <button class="generate-btn" style="flex:1;" onclick="generateCode()">生成 Excel 公式</button>
      <button class="download-btn" style="padding:10px 16px;" onclick="showExample()">查看示例</button>
    </div>
  </section>

  <!-- 右侧公式预览 -->
  <section class="code-panel">
    <div class="code-header">
      <span class="code-title" id="codeFilename">' 生成的公式</span>
      <div style="display:flex;gap:8px;">
        <button class="download-btn" onclick="downloadFormula()">下载 .txt</button>
        <button class="copy-btn" id="copyBtn" onclick="copyCode()">复制公式</button>
      </div>
    </div>
    <div class="code-area" id="codeArea">
      <span class="code-placeholder">// 选择左侧场景，填写参数后点击「生成 Excel 公式」</span>
    </div>
    <div class="formula-explain" id="formulaExplain" style="display:none;"></div>
  </section>

</div>

<footer>
  适用于 Excel 2016 及以上版本 · 生成公式可直接粘贴到单元格使用
</footer>

<script>
// ===== 场景定义 =====
const SCENES = {
  vlookup: {
    name: 'VLOOKUP 查找匹配',
    desc: '在数据表首列查找指定值，返回该行指定列的数据。支持近似匹配和精确匹配。',
    filename: 'VLOOKUP',
    params: [
      { key: 'lookupValue', label: '查找值', type: 'text', default: 'A2', hint: '如 A2 或 "张三"' },
      { key: 'tableArray', label: '查找区域', type: 'text', default: 'Sheet2!A:D', hint: '如 Sheet2!A:D' },
      { key: 'colIndex', label: '返回列数', type: 'number', default: 3, hint: '从查找区域首列算起第几列' },
      { key: 'matchType', label: '匹配方式', type: 'select', options: ['精确匹配 (FALSE)', '近似匹配 (TRUE)'], default: 0 },
    ],
    generate: (p) => {
      const matchVal = p.matchType.includes('精确') ? 'FALSE' : 'TRUE';
      const formula = `=VLOOKUP(${p.lookupValue}, ${p.tableArray}, ${p.colIndex}, ${matchVal})`;
      const explain = `VLOOKUP 在 ${p.tableArray} 的第一列中查找 ${p.lookupValue}，找到后返回该行第 ${p.colIndex} 列的值。${matchVal === 'FALSE' ? '精确匹配，找不到返回 #N/A' : '近似匹配，要求首列升序排列'}`;
      return { formula, explain };
    }
  },

  xlookup: {
    name: 'XLOOKUP 高级查找',
    desc: 'Excel 365/2021 新增函数，比 VLOOKUP 更强大，支持反向查找、通配符匹配。',
    filename: 'XLOOKUP',
    params: [
      { key: 'lookupValue', label: '查找值', type: 'text', default: 'A2' },
      { key: 'lookupArray', label: '查找范围', type: 'text', default: 'Sheet2!A:A', hint: '单列或单行' },
      { key: 'returnArray', label: '返回范围', type: 'text', default: 'Sheet2!B:B', hint: '与查找范围等大' },
      { key: 'ifNotFound', label: '找不到时返回', type: 'text', default: '"未找到"', hint: '留空则返回 #N/A' },
    ],
    generate: (p) => {
      const formula = `=XLOOKUP(${p.lookupValue}, ${p.lookupArray}, ${p.returnArray}, ${p.ifNotFound})`;
      const explain = `XLOOKUP 在 ${p.lookupArray} 中查找 ${p.lookupValue}，找到后从 ${p.returnArray} 返回对应位置的值。找不到时显示 ${p.ifNotFound}。`;
      return { formula, explain };
    }
  },

  sumifs: {
    name: 'SUMIFS 条件求和',
    desc: '按多个条件对指定区域求和。财务汇总、按部门/月份统计金额常用。',
    filename: 'SUMIFS',
    params: [
      { key: 'sumRange', label: '求和区域', type: 'text', default: 'D:D', hint: '要求和的金额列' },
      { key: 'criteria1Range', label: '条件1区域', type: 'text', default: 'A:A', hint: '如部门列' },
      { key: 'criteria1', label: '条件1', type: 'text', default: '"财务部"', hint: '如 "财务部" 或 ">1000"' },
      { key: 'criteria2Range', label: '条件2区域（可选）', type: 'text', default: 'B:B', hint: '如月份列' },
      { key: 'criteria2', label: '条件2（可选）', type: 'text', default: '"2024-01"', hint: '如 "2024-01"' },
    ],
    generate: (p) => {
      const formula = `=SUMIFS(${p.sumRange}, ${p.criteria1Range}, ${p.criteria1}, ${p.criteria2Range}, ${p.criteria2})`;
      const explain = `对 ${p.sumRange} 求和，满足两个条件：${p.criteria1Range} 等于 ${p.criteria1}，且 ${p.criteria2Range} 等于 ${p.criteria2}。`;
      return { formula, explain };
    }
  },

  countifs: {
    name: 'COUNTIFS 条件计数',
    desc: '按多个条件统计符合条件的记录数。统计人数、单据数常用。',
    filename: 'COUNTIFS',
    params: [
      { key: 'criteria1Range', label: '条件1区域', type: 'text', default: 'A:A' },
      { key: 'criteria1', label: '条件1', type: 'text', default: '"已审核"', hint: '如 "已审核" 或 ">100"' },
      { key: 'criteria2Range', label: '条件2区域（可选）', type: 'text', default: 'B:B' },
      { key: 'criteria2', label: '条件2（可选）', type: 'text', default: '"2024-01"', hint: '留空则只按条件1统计' },
    ],
    generate: (p) => {
      const c2 = p.criteria2 ? `, ${p.criteria2Range}, ${p.criteria2}` : '';
      const formula = `=COUNTIFS(${p.criteria1Range}, ${p.criteria1}${c2})`;
      const explain = `统计符合条件的记录数：${p.criteria1Range} 等于 ${p.criteria1}${p.criteria2 ? `，且 ${p.criteria2Range} 等于 ${p.criteria2}` : ''}。`;
      return { formula, explain };
    }
  },

  ifnested: {
    name: 'IF 嵌套分级',
    desc: '多条件分级判断。绩效评级、账龄分析、金额区间判断常用。',
    filename: 'IF嵌套',
    params: [
      { key: 'testValue', label: '判断值', type: 'text', default: 'A2', hint: '如 A2 或 B2' },
      { key: 'threshold1', label: '第一档阈值', type: 'text', default: '90', hint: '大于等于此值为A' },
      { key: 'result1', label: '第一档结果', type: 'text', default: '"A"', hint: '如 "优秀"' },
      { key: 'threshold2', label: '第二档阈值', type: 'text', default: '60', hint: '大于等于此值为B' },
      { key: 'result2', label: '第二档结果', type: 'text', default: '"B"', hint: '如 "合格"' },
      { key: 'result3', label: '第三档结果', type: 'text', default: '"C"', hint: '低于第二档的值为此结果' },
    ],
    generate: (p) => {
      const formula = `=IF(${p.testValue}>=${p.threshold1}, ${p.result1}, IF(${p.testValue}>=${p.threshold2}, ${p.result2}, ${p.result3}))`;
      const explain = `判断 ${p.testValue}：≥${p.threshold1} 显示 ${p.result1}；≥${p.threshold2} 显示 ${p.result2}；否则显示 ${p.result3}。`;
      return { formula, explain };
    }
  },

  date: {
    name: '日期处理函数',
    desc: '从日期中提取年/月/日，计算账龄、工龄、月份差等。',
    filename: '日期函数',
    params: [
      { key: 'func', label: '函数类型', type: 'select', options: ['提取年份 YEAR', '提取月份 MONTH', '提取天数 DAY', '计算月份差 DATEDIF'], default: 0 },
      { key: 'date1', label: '日期1', type: 'text', default: 'A2', hint: '起始日期或单元格' },
      { key: 'date2', label: '日期2（仅DATEDIF）', type: 'text', default: 'TODAY()', hint: '结束日期，默认今天' },
    ],
    generate: (p) => {
      let formula, explain;
      if (p.func.includes('年份')) {
        formula = `=YEAR(${p.date1})`;
        explain = `从 ${p.date1} 中提取年份，如 2024-01-15 → 2024`;
      } else if (p.func.includes('月份')) {
        formula = `=MONTH(${p.date1})`;
        explain = `从 ${p.date1} 中提取月份，如 2024-01-15 → 1`;
      } else if (p.func.includes('天数')) {
        formula = `=DAY(${p.date1})`;
        explain = `从 ${p.date1} 中提取天数，如 2024-01-15 → 15`;
      } else {
        formula = `=DATEDIF(${p.date1}, ${p.date2}, "M")`;
        explain = `计算 ${p.date1} 到 ${p.date2} 之间的完整月数。常用于账龄、工龄计算。`;
      }
      return { formula, explain };
    }
  },

  text: {
    name: '文本处理函数',
    desc: '提取字符串、拼接、清洗空格。从身份证/账号中提取信息常用。',
    filename: '文本函数',
    params: [
      { key: 'func', label: '函数类型', type: 'select', options: ['左侧提取 LEFT', '右侧提取 RIGHT', '中间提取 MID', '拼接文本 CONCAT'], default: 0 },
      { key: 'text', label: '文本/单元格', type: 'text', default: 'A2' },
      { key: 'num', label: '提取字符数/起始位置', type: 'text', default: '6', hint: 'LEFT/RIGHT是提取几个字；MID是从第几个字开始' },
      { key: 'num2', label: '提取长度（仅MID）', type: 'text', default: '4', hint: 'MID函数要提取几个字' },
    ],
    generate: (p) => {
      let formula, explain;
      if (p.func.includes('左侧')) {
        formula = `=LEFT(${p.text}, ${p.num})`;
        explain = `从 ${p.text} 左侧提取 ${p.num} 个字符。`;
      } else if (p.func.includes('右侧')) {
        formula = `=RIGHT(${p.text}, ${p.num})`;
        explain = `从 ${p.text} 右侧提取 ${p.num} 个字符。`;
      } else if (p.func.includes('中间')) {
        formula = `=MID(${p.text}, ${p.num}, ${p.num2})`;
        explain = `从 ${p.text} 的第 ${p.num} 位开始，提取 ${p.num2} 个字符。常用于身份证提取出生日期。`;
      } else {
        formula = `=CONCAT(${p.text}, " ", B2)`;
        explain = `将 ${p.text} 和 B2 的内容拼接在一起。可拼接多个单元格。`;
      }
      return { formula, explain };
    }
  },

  indexMatch: {
    name: 'INDEX+MATCH 查找',
    desc: '比VLOOKUP更灵活的查找方式，支持反向查找、列顺序无关。',
    filename: 'INDEX+MATCH',
    params: [
      { key: 'lookupValue', label: '查找值', type: 'text', default: 'A2' },
      { key: 'matchRange', label: '查找列', type: 'text', default: 'Sheet2!A:A', hint: '在这列里找' },
      { key: 'returnRange', label: '返回列', type: 'text', default: 'Sheet2!B:B', hint: '返回这列的值' },
    ],
    generate: (p) => {
      const formula = `=INDEX(${p.returnRange}, MATCH(${p.lookupValue}, ${p.matchRange}, 0))`;
      const explain = `先在 ${p.matchRange} 找到 ${p.lookupValue} 所在行号，再从 ${p.returnRange} 返回对应行的值。优势：查找列和返回列顺序无关，支持反向查找。`;
      return { formula, explain };
    }
  },

  sumproduct: {
    name: 'SUMPRODUCT 多条件',
    desc: '不用数组公式的多条件求和/计数，兼容性好，老版本Excel也能用。',
    filename: 'SUMPRODUCT',
    params: [
      { key: 'sumRange', label: '求和区域', type: 'text', default: 'D:D', hint: '要求和的金额列' },
      { key: 'crit1Range', label: '条件1区域', type: 'text', default: 'B:B', hint: '如 B 列（部门）' },
      { key: 'crit1', label: '条件1', type: 'text', default: '"财务部"', hint: '如 "财务部" 或 ">1000"' },
      { key: 'crit2Range', label: '条件2区域', type: 'text', default: 'C:C', hint: '如 C 列（月份）' },
      { key: 'crit2', label: '条件2', type: 'text', default: '">=2024-01-01"', hint: '如 ">2024-01-01"' },
    ],
    generate: (p) => {
      const formula = `=SUMPRODUCT((${p.crit1Range}=${p.crit1})*(${p.crit2Range}=${p.crit2})*${p.sumRange})`;
      const explain = `同时满足条件1（${p.crit1Range} = ${p.crit1}）和条件2（${p.crit2Range} = ${p.crit2}）时，对 ${p.sumRange} 求和。SUMPRODUCT不需要按Ctrl+Shift+Enter，直接回车即可。`;
      return { formula, explain };
    }
  },

  iferror: {
    name: 'IFERROR 错误处理',
    desc: '包装任何公式，出错时返回指定提示，避免#N/A、#DIV/0!等难看的错误值。',
    filename: 'IFERROR',
    params: [
      { key: 'innerFormula', label: '原公式', type: 'text', default: 'VLOOKUP(A2, Sheet2!A:B, 2, FALSE)', hint: '你原来的公式' },
      { key: 'defaultValue', label: '出错时显示', type: 'text', default: '0', hint: '如 0、"未找到"、""（空）' },
    ],
    generate: (p) => {
      const formula = `=IFERROR(${p.innerFormula}, ${p.defaultValue})`;
      const explain = `如果「${p.innerFormula}」计算出错（如 #N/A、#DIV/0!），就显示 ${p.defaultValue}；否则正常显示计算结果。`;
      return { formula, explain };
    }
  },

  averageifs: {
    name: 'AVERAGEIFS 多条件平均',
    desc: '按多个条件计算平均值，如"计算部门A、2024年的平均工资"。',
    filename: 'AVERAGEIFS',
    params: [
      { key: 'avgRange', label: '求平均区域', type: 'text', default: 'D:D', hint: '要求平均的数值列' },
      { key: 'crit1Range', label: '条件1区域', type: 'text', default: 'B:B' },
      { key: 'crit1', label: '条件1', type: 'text', default: '"销售部"' },
      { key: 'crit2Range', label: '条件2区域（可选）', type: 'text', default: 'C:C' },
      { key: 'crit2', label: '条件2（可选）', type: 'text', default: '">10000"' },
    ],
    generate: (p) => {
      const formula = `=AVERAGEIFS(${p.avgRange}, ${p.crit1Range}, ${p.crit1}, ${p.crit2Range}, ${p.crit2})`;
      const explain = `在满足条件（${p.crit1Range} = ${p.crit1} 且 ${p.crit2Range} ${p.crit2}）的行中，计算 ${p.avgRange} 的平均值。`;
      return { formula, explain };
    }
  },

  conditionalFormat: {
    name: '条件格式公式',
    desc: '常用条件格式公式：标记重复值、过期日期、低于平均值等。',
    filename: '条件格式',
    params: [
      { key: 'cfType', label: '条件类型', type: 'select', options: ['标记重复值', '标记到期/过期', '低于平均值标红', '周末高亮'], default: 0 },
      { key: 'range', label: '应用范围', type: 'text', default: 'A2:A100', hint: '如 A2:A100' },
      { key: 'dateCell', label: '日期单元格', type: 'text', default: 'A2', hint: '日期判断时用' },
    ],
    generate: (p) => {
      let formula, explain;
      if (p.cfType.includes('重复')) {
        formula = `=COUNTIF($A:$A, A2)>1`;
        explain = `在条件格式中输入此公式，选中 ${p.range}，即可标记出所有重复值。首次出现不标，重复的标色。`;
      } else if (p.cfType.includes('到期')) {
        formula = `=AND(${p.dateCell}<>"", ${p.dateCell}-TODAY()<=30)`;
        explain = `选中 ${p.range}，设置条件格式公式。距离今天≤30天的日期会被标记（即将到期提醒）。`;
      } else if (p.cfType.includes('平均值')) {
        formula = `=A2<AVERAGE($A$2:$A$100)`;
        explain = `选中 ${p.range}，低于平均值的单元格标红。可改成 > 表示高于平均值。`;
      } else {
        formula = `=WEEKDAY(A2, 2)>5`;
        explain = `选中日期列，周末（周六周日）高亮显示。WEEKDAY第二参数为2时，周一=1，周日=7。`;
      }
      return { formula, explain };
    }
  },

  npv: {
    name: 'NPV 净现值',
    desc: '计算投资项目净现值，判断项目是否可行。财务分析常用。',
    filename: 'NPV',
    params: [
      { key: 'rate', label: '折现率', type: 'text', default: '0.08', hint: '如 0.08 表示 8%' },
      { key: 'cashflow1', label: '第1年现金流', type: 'text', default: 'B2', hint: '注意：初始投资在B2，第1年收益在B3...' },
      { key: 'cashflowN', label: '第N年现金流', type: 'text', default: 'B5', hint: '最后一年的单元格' },
    ],
    generate: (p) => {
      const formula = `=NPV(${p.rate}, ${p.cashflow1}:${p.cashflowN})`;
      const explain = `按 ${p.rate} 的折现率，计算 ${p.cashflow1} 到 ${p.cashflowN} 期间现金流的净现值。NPV>0 表示项目可行，NPV<0 表示不可行。注意：初始投资（第0年）如果在现金流连外，要单独加：=NPV(0.08, B3:B5)+B2`;
      return { formula, explain };
    }
  }
};

// ===== 状态 =====
let currentScene = 'vlookup';

// ===== 渲染场景列表 =====
function renderSceneList() {
  const container = document.getElementById('sceneList');
  const searchVal = document.getElementById('sceneSearch').value.toLowerCase();
  container.innerHTML = '';
  let count = 0;
  Object.entries(SCENES).forEach(([key, scene]) => {
    if (searchVal && !scene.name.toLowerCase().includes(searchVal) && !scene.desc.toLowerCase().includes(searchVal)) return;
    count++;
    const item = document.createElement('div');
    item.className = 'scene-item' + (key === currentScene ? ' active' : '');
    item.innerHTML = `<div class="name">${scene.name}</div><div class="desc">${scene.desc.slice(0, 15)}...</div>`;
    item.onclick = () => { currentScene = key; renderSceneList(); renderParams(); };
    container.appendChild(item);
  });
  if (count === 0) {
    container.innerHTML = '<div style="padding:20px;text-align:center;color:#999;font-size:13px;">未找到匹配公式</div>';
  }
}

function showExample() {
  const ex = EXAMPLES[currentScene];
  if (!ex) return;
  document.getElementById('exampleTitle').textContent = SCENES[currentScene].name + ' - 使用示例';
  document.getElementById('exampleBody').innerHTML = `
    <div class="example-block">
      <strong>输入参数示例</strong>
      ${ex.params}
    </div>
    <div class="example-block">
      <strong>生成的公式</strong>
      <pre>${ex.output}</pre>
    </div>
    <div class="example-block">
      <strong>效果说明</strong>
      ${ex.note}
    </div>
  `;
  document.getElementById('exampleModal').classList.add('show');
}

function closeExample() {
  document.getElementById('exampleModal').classList.remove('show');
}

// ===== 下载功能 =====
function downloadFormula() {
  const code = document.getElementById('codeArea').textContent;
  if (!code || code.includes('选择左侧场景')) {
    alert('请先生成公式');
    return;
  }
  const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SCENES[currentScene].filename + '.txt';
  a.click();
  URL.revokeObjectURL(url);
}

// ===== 渲染参数表单 =====
function renderParams() {
  const scene = SCENES[currentScene];
  document.getElementById('sceneName').textContent = scene.name;
  document.getElementById('sceneDesc').textContent = scene.desc;
  document.getElementById('codeFilename').textContent = "' " + scene.filename;

  const form = document.getElementById('paramForm');
  form.innerHTML = '';

  scene.params.forEach((param) => {
    const group = document.createElement('div');
    group.className = 'form-group';

    const label = document.createElement('label');
    label.innerHTML = `${param.label}<span class="hint">${param.hint || ''}</span>`;

    let input;
    if (param.type === 'select') {
      input = document.createElement('select');
      param.options.forEach((opt, i) => {
        const option = document.createElement('option');
        option.value = opt;
        option.textContent = opt;
        if (i === param.default) option.selected = true;
        input.appendChild(option);
      });
    } else {
      input = document.createElement('input');
      input.type = param.type === 'number' ? 'number' : 'text';
      input.value = param.default;
    }
    input.id = 'param_' + param.key;

    group.appendChild(label);
    group.appendChild(input);
    form.appendChild(group);
  });
}

// ===== 生成公式 =====
function generateCode() {
  const scene = SCENES[currentScene];
  const params = {};
  scene.params.forEach(p => {
    const el = document.getElementById('param_' + p.key);
    params[p.key] = el.value;
  });

  const result = scene.generate(params);
  document.getElementById('codeArea').textContent = result.formula;

  const explainEl = document.getElementById('formulaExplain');
  explainEl.style.display = 'block';
  explainEl.textContent = result.explain;
}

// ===== 复制公式 =====
function copyCode() {
  const code = document.getElementById('codeArea').textContent;
  if (!code || code.includes('选择左侧场景')) return;

  navigator.clipboard.writeText(code).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '已复制';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '复制公式';
      btn.classList.remove('copied');
    }, 2000);
  });
}

// ===== 初始化 =====
renderSceneList();
renderParams();
