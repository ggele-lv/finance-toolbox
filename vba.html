<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财务VBA自动化代码生成器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='15' fill='%2360a5fa'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='%23ffffff' font-family='monospace'>V</text></svg>">
<style>
  :root {
    --primary: #3b82f6;
    --primary-light: #93c5fd;
    --accent: #60a5fa;
    --bg: #f0f9ff;
    --surface: #ffffff;
    --border: #e0f2fe;
    --text: #0c4a6e;
    --text-secondary: #64748b;
    --code-bg: #1e293b;
    --code-text: #e2e8f0;
    --success: #059669;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  /* ===== 顶部 ===== */
  header {
    background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
    color: var(--text);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #0c4a6e;
  }
  header h1 span { color: #3b82f6; }
  .privacy-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #0c4a6e;
    opacity: 0.8;
  }
  .privacy-badge .dot {
    width: 8px; height: 8px;
    background: #6fd47e;
    border-radius: 50%;
  }

  /* ===== 主工作区 ===== */
  .workspace {
    display: grid;
    grid-template-columns: 220px 1fr 1fr;
    gap: 0;
    min-height: calc(100vh - 64px);
  }

  /* ===== 左侧场景选择 ===== */
  .scene-panel {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px 0;
  }
  .scene-panel .panel-title {
    padding: 0 20px 12px;
    font-size: 12px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .search-box {
    padding: 0 20px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .search-box input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    background: #f8fafc;
  }
  .search-box input:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
  }
  .scene-item {
    padding: 14px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.15s;
  }
  .scene-item:hover { background: #f0f9ff; }
  .scene-item.active {
    border-left-color: var(--primary);
    background: #eff6ff;
  }
  .scene-item .name {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 2px;
  }
  .scene-item .desc {
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* 示例弹窗 */
  .example-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .example-modal.show { display: flex; }
  .example-content {
    background: #fff;
    border-radius: 10px;
    padding: 28px;
    max-width: 600px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .example-content h3 {
    font-size: 17px;
    margin-bottom: 16px;
    color: var(--text);
  }
  .example-content .example-block {
    margin-bottom: 16px;
    padding: 12px;
    background: #f8fafc;
    border-radius: 6px;
    font-size: 13px;
  }
  .example-content .example-block strong {
    display: block;
    margin-bottom: 6px;
    color: var(--primary);
  }
  .example-content pre {
    background: #1e293b;
    color: #e2e8f0;
    padding: 12px;
    border-radius: 6px;
    font-size: 12px;
    overflow-x: auto;
    white-space: pre-wrap;
  }
  .close-modal {
    margin-top: 12px;
    padding: 8px 24px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }

  /* 下载按钮 */
  .download-btn {
    padding: 6px 14px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text);
  }
  .download-btn:hover {
    border-color: var(--accent);
    color: var(--primary);
  }

  /* ===== 中间参数区 ===== */
  .param-panel {
    padding: 28px 32px;
    background: var(--bg);
    border-right: 1px solid var(--border);
    overflow-y: auto;
  }
  .param-panel h2 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .param-panel .scene-desc {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
    color: var(--text);
  }
  .form-group label .hint {
    font-weight: 400;
    color: var(--text-secondary);
    font-size: 12px;
    margin-left: 6px;
  }
  .form-group input,
  .form-group select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 14px;
    background: var(--surface);
    transition: border-color 0.15s;
  }
  .form-group input:focus,
  .form-group select:focus {
    outline: none;
    border-color: var(--primary-light);
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .generate-btn {
    width: 100%;
    padding: 12px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s;
  }
  .generate-btn:hover { background: var(--primary-light); }

  /* ===== 右侧代码区 ===== */
  .code-panel {
    padding: 28px 32px;
    background: var(--code-bg);
    display: flex;
    flex-direction: column;
  }
  .code-panel .code-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .code-panel .code-title {
    color: #888;
    font-size: 12px;
    font-family: "Consolas", monospace;
  }
  .copy-btn {
    padding: 6px 16px;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .copy-btn:hover { background: rgba(201,169,110,0.1); }
  .copy-btn.copied {
    background: var(--accent);
    color: #fff;
  }
  .code-area {
    flex: 1;
    background: transparent;
    color: var(--code-text);
    font-family: "Consolas", "Courier New", monospace;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre;
    overflow: auto;
    min-height: 400px;
  }
  .code-placeholder {
    color: #555;
    font-style: italic;
  }

  /* ===== 底部 ===== */
  footer {
    text-align: center;
    padding: 16px;
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--surface);
    border-top: 1px solid var(--border);
  }

  /* ===== 响应式 ===== */
  @media (max-width: 1024px) {
    .workspace {
      grid-template-columns: 1fr;
    }
    .form-group input,
    .form-group select {
      font-size: 16px;
    }
    .scene-panel {
      border-right: none;
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
    }
    .scene-panel .panel-title { display: none; }
    .scene-item {
      display: inline-block;
      width: auto;
      border-left: none;
      border-bottom: 3px solid transparent;
      margin-right: 4px;
    }
    .scene-item.active {
      border-left: none;
      border-bottom-color: var(--accent);
    }
    .param-panel { border-right: none; }
    .code-panel { min-height: 300px; }
  }
</style>
</head>
<body>

<header>
  <h1>财务VBA<span>自动化</span>代码生成器</h1>
  <div class="privacy-badge">
    <div class="dot"></div>
    数据全程本地处理 · 不出域
  </div>
</header>

<div class="workspace">

  <!-- 左侧场景选择 -->
  <aside class="scene-panel">
    <div class="panel-title">场景列表</div>
    <div class="search-box">
      <input type="text" id="sceneSearch" placeholder="搜索场景，如：拆分、去重..." oninput="renderSceneList()">
    </div>
    <div id="sceneList"></div>
  </aside>

  <!-- 中间参数表单 -->
  <section class="param-panel">
    <h2 id="sceneName"></h2>
    <p class="scene-desc" id="sceneDesc"></p>
    <div id="paramForm"></div>
    <div style="display:flex;gap:12px;">
      <button class="generate-btn" style="flex:1;" onclick="generateCode()">生成 VBA 代码</button>
      <button class="download-btn" style="padding:10px 16px;" onclick="showExample()">查看示例</button>
    </div>
  </section>

  <!-- 右侧代码预览 -->
  <section class="code-panel">
    <div class="code-header">
      <span class="code-title" id="codeFilename">' 生成的宏代码</span>
      <div style="display:flex;gap:8px;">
        <button class="download-btn" onclick="downloadCode()">下载 .bas</button>
        <button class="copy-btn" id="copyBtn" onclick="copyCode()">复制代码</button>
      </div>
    </div>
    <div class="code-area" id="codeArea">
      <span class="code-placeholder">// 选择左侧场景，填写参数后点击「生成 VBA 代码」</span>
    </div>
  </section>

</div>

<footer>
  适用于 Excel 2016 及以上版本 · 生成代码可直接粘贴到 VBA 编辑器（Alt+F11）使用
</footer>

<script>
// ===== 场景定义 =====
const SCENES = {
  voucher: {
    name: '凭证整理',
    desc: '按凭证字号汇总借贷方金额，自动生成试算平衡表，快速核对凭证数据。',
    filename: 'Voucher_Summary.bas',
    params: [
      { key: 'sheetName', label: '数据表名称', type: 'text', default: 'Sheet1', hint: '存放凭证明细的工作表' },
      { key: 'voucherCol', label: '凭证字号列', type: 'text', default: 'B', hint: '如 B 列' },
      { key: 'dateCol', label: '凭证日期列', type: 'text', default: 'A', hint: '如 A 列' },
      { key: 'summaryCol', label: '摘要列', type: 'text', default: 'C', hint: '如 C 列' },
      { key: 'debitCol', label: '借方金额列', type: 'text', default: 'D', hint: '如 D 列' },
      { key: 'creditCol', label: '贷方金额列', type: 'text', default: 'E', hint: '如 E 列' },
      { key: 'startRow', label: '数据起始行', type: 'number', default: 2, hint: '通常从第2行开始' },
    ],
    generate: (p) => {
      return `Sub 凭证整理汇总()
    ' 生成时间: ${new Date().toLocaleString('zh-CN')}
    Dim ws As Worksheet
    Dim lastRow As Long, i As Long
    Dim dict As Object
    Dim voucherNo As String
    Dim debitSum As Double, creditSum As Double

    Set ws = ThisWorkbook.Sheets("${p.sheetName}")
    lastRow = ws.Cells(ws.Rows.Count, "${p.dateCol}").End(xlUp).Row

    Set dict = CreateObject("Scripting.Dictionary")

    ' 遍历凭证明细，按凭证字号汇总
    For i = ${p.startRow} To lastRow
        voucherNo = Trim(ws.Range("${p.voucherCol}" & i).Value)
        If voucherNo <> "" Then
            If Not dict.Exists(voucherNo) Then
                dict.Add voucherNo, Array(0, 0, ws.Range("${p.dateCol}" & i).Value, ws.Range("${p.summaryCol}" & i).Value)
            End If
            debitSum = dict(voucherNo)(0) + ws.Range("${p.debitCol}" & i).Value
            creditSum = dict(voucherNo)(1) + ws.Range("${p.creditCol}" & i).Value
            dict(voucherNo) = Array(debitSum, creditSum, dict(voucherNo)(2), dict(voucherNo)(3))
        End If
    Next i

    ' 输出到新工作表
    Dim wsOut As Worksheet
    Set wsOut = ThisWorkbook.Sheets.Add(After:=ws)
    wsOut.Name = "凭证汇总"

    wsOut.Range("A1").Value = "凭证字号"
    wsOut.Range("B1").Value = "凭证日期"
    wsOut.Range("C1").Value = "摘要"
    wsOut.Range("D1").Value = "借方合计"
    wsOut.Range("E1").Value = "贷方合计"
    wsOut.Range("F1").Value = "差额"

    i = 2
    Dim key As Variant
    For Each key In dict.Keys
        wsOut.Range("A" & i).Value = key
        wsOut.Range("B" & i).Value = dict(key)(2)
        wsOut.Range("C" & i).Value = dict(key)(3)
        wsOut.Range("D" & i).Value = dict(key)(0)
        wsOut.Range("E" & i).Value = dict(key)(1)
        wsOut.Range("F" & i).Value = dict(key)(0) - dict(key)(1)
        i = i + 1
    Next key

    ' 格式化
    wsOut.Range("A1:F1").Font.Bold = True
    wsOut.Columns("D:F").NumberFormat = "#,##0.00"
    wsOut.Columns("A:F").AutoFit

    MsgBox "凭证汇总完成，共处理 " & dict.Count & " 张凭证", vbInformation
End Sub`;
    }
  },

  bankMatch: {
    name: '流水核对',
    desc: '银行流水与企业日记账双向匹配，标记已匹配/未匹配记录，快速定位差异。',
    filename: 'Bank_Reconciliation.bas',
    params: [
      { key: 'bankSheet', label: '银行流水表名', type: 'text', default: '银行流水' },
      { key: 'cashSheet', label: '企业日记账表名', type: 'text', default: '企业日记账' },
      { key: 'amountCol', label: '金额列', type: 'text', default: 'C', hint: '两张表金额列一致' },
      { key: 'dateCol', label: '日期列', type: 'text', default: 'A' },
      { key: 'startRow', label: '数据起始行', type: 'number', default: 2 },
      { key: 'matchMode', label: '匹配方式', type: 'select', options: ['按金额匹配', '按金额+日期匹配'], default: 0 },
    ],
    generate: (p) => {
      const mode = p.matchMode === '按金额+日期匹配' ? '日期+金额' : '金额';
      return `Sub 银行流水核对()
    ' 生成时间: ${new Date().toLocaleString('zh-CN')}
    ' 匹配方式: ${mode}
    Dim wsBank As Worksheet, wsCash As Worksheet
    Dim lastRowBank As Long, lastRowCash As Long
    Dim i As Long, j As Long
    Dim matchedBank() As Boolean, matchedCash() As Boolean

    Set wsBank = ThisWorkbook.Sheets("${p.bankSheet}")
    Set wsCash = ThisWorkbook.Sheets("${p.cashSheet}")

    lastRowBank = wsBank.Cells(wsBank.Rows.Count, "${p.amountCol}").End(xlUp).Row
    lastRowCash = wsCash.Cells(wsCash.Rows.Count, "${p.amountCol}").End(xlUp).Row

    ReDim matchedBank(${p.startRow} To lastRowBank)
    ReDim matchedCash(${p.startRow} To lastRowCash)

    ' 标记匹配列
    wsBank.Range("G1").Value = "匹配状态"
    wsCash.Range("G1").Value = "匹配状态"

    For i = ${p.startRow} To lastRowBank
        Dim amtBank As Double, dateBank As Variant
        amtBank = Round(wsBank.Range("${p.amountCol}" & i).Value, 2)
        dateBank = wsBank.Range("${p.dateCol}" & i).Value

        For j = ${p.startRow} To lastRowCash
            If Not matchedCash(j) Then
                Dim amtCash As Double, dateCash As Variant
                amtCash = Round(wsCash.Range("${p.amountCol}" & j).Value, 2)
                dateCash = wsCash.Range("${p.dateCol}" & j).Value

                ${p.matchMode === '按金额+日期匹配'
                  ? `If amtBank = amtCash And CDate(dateBank) = CDate(dateCash) Then`
                  : `If amtBank = amtCash Then`}
                    matchedBank(i) = True
                    matchedCash(j) = True
                    wsBank.Range("G" & i).Value = "已匹配"
                    wsCash.Range("G" & j).Value = "已匹配"
                    Exit For
                End If
            End If
        Next j

        If Not matchedBank(i) Then
            wsBank.Range("G" & i).Value = "未匹配"
        End If
    Next i

    For j = ${p.startRow} To lastRowCash
        If Not matchedCash(j) Then
            wsCash.Range("G" & j).Value = "未匹配"
        End If
    Next j

    ' 统计
    Dim unmatchedBank As Long, unmatchedCash As Long
    unmatchedBank = WorksheetFunction.CountIf(wsBank.Range("G" & ${p.startRow} & ":G" & lastRowBank), "未匹配")
    unmatchedCash = WorksheetFunction.CountIf(wsCash.Range("G" & ${p.startRow} & ":G" & lastRowCash), "未匹配")

    MsgBox "核对完成！" & vbCrLf & _
           "银行流水未匹配: " & unmatchedBank & " 笔" & vbCrLf & _
           "企业日记账未匹配: " & unmatchedCash & " 笔", vbInformation
End Sub`;
    }
  },

  dataClean: {
    name: '数据清洗',
    desc: '一键去除重复行、处理空值、统一日期和数字格式，让原始数据变干净。',
    filename: 'Data_Clean.bas',
    params: [
      { key: 'sheetName', label: '数据表名称', type: 'text', default: 'Sheet1' },
      { key: 'dupCol', label: '去重依据列', type: 'text', default: 'A', hint: '按此列内容去重' },
      { key: 'startRow', label: '数据起始行', type: 'number', default: 2 },
      { key: 'dateCols', label: '日期格式列', type: 'text', default: 'A,B', hint: '逗号分隔多列' },
      { key: 'numCols', label: '数字格式列', type: 'text', default: 'D,E,F', hint: '逗号分隔多列' },
    ],
    generate: (p) => {
      return `Sub 数据清洗()
    ' 生成时间: ${new Date().toLocaleString('zh-CN')}
    Dim ws As Worksheet
    Dim lastRow As Long, i As Long
    Dim cleaned As Long

    Set ws = ThisWorkbook.Sheets("${p.sheetName}")
    lastRow = ws.Cells(ws.Rows.Count, "${p.dupCol}").End(xlUp).Row

    ' 1. 去除重复行
    cleaned = 0
    For i = lastRow To ${p.startRow} Step -1
        If ws.Range("${p.dupCol}" & i).Value = "" Then
            ws.Rows(i).Delete
            cleaned = cleaned + 1
        End If
    Next i

    ' 2. 统一日期格式
    Dim dateCols As Variant, c As Variant
    dateCols = Split("${p.dateCols}", ",")
    For Each c In dateCols
        c = Trim(c)
        If c <> "" Then
            ws.Range(c & ${p.startRow} & ":" & c & lastRow).NumberFormat = "yyyy-mm-dd"
        End If
    Next c

    ' 3. 统一数字格式（千分位两位小数）
    Dim numCols As Variant
    numCols = Split("${p.numCols}", ",")
    For Each c In numCols
        c = Trim(c)
        If c <> "" Then
            ws.Range(c & ${p.startRow} & ":" & c & lastRow).NumberFormat = "#,##0.00"
        End If
    Next c

    ' 4. 去除单元格前后空格
    Dim usedRng As Range
    Set usedRng = ws.UsedRange
    For Each cell In usedRng
        If VarType(cell.Value) = vbString Then
            cell.Value = Trim(cell.Value)
        End If
    Next cell

    MsgBox "数据清洗完成！" & vbCrLf & _
           "删除空行: " & cleaned & " 行" & vbCrLf & _
           "日期列已格式化: ${p.dateCols}" & vbCrLf & _
           "数字列已格式化: ${p.numCols}", vbInformation
End Sub`;
    }
  },

  pivot: {
    name: '报表汇总',
    desc: '按指定维度自动分类汇总数据，生成汇总表，替代手动数据透视表。',
    filename: 'Pivot_Summary.bas',
    params: [
      { key: 'srcSheet', label: '数据源表名', type: 'text', default: '明细数据' },
      { key: 'dimCol', label: '汇总维度列', type: 'text', default: 'B', hint: '如按部门/科目汇总' },
      { key: 'valCol', label: '汇总值列', type: 'text', default: 'D', hint: '要汇总的金额列' },
      { key: 'startRow', label: '数据起始行', type: 'number', default: 2 },
      { key: 'outName', label: '输出表名', type: 'text', default: '汇总表' },
    ],
    generate: (p) => {
      return `Sub 报表汇总()
    ' 生成时间: ${new Date().toLocaleString('zh-CN')}
    Dim wsSrc As Worksheet
    Dim lastRow As Long, i As Long
    Dim dict As Object
    Dim key As String
    Dim sumVal As Double, cnt As Long

    Set wsSrc = ThisWorkbook.Sheets("${p.srcSheet}")
    lastRow = wsSrc.Cells(wsSrc.Rows.Count, "${p.dimCol}").End(xlUp).Row

    Set dict = CreateObject("Scripting.Dictionary")

    ' 按维度汇总
    For i = ${p.startRow} To lastRow
        key = Trim(wsSrc.Range("${p.dimCol}" & i).Value)
        If key <> "" Then
            sumVal = wsSrc.Range("${p.valCol}" & i).Value
            If dict.Exists(key) Then
                dict(key)(0) = dict(key)(0) + sumVal
                dict(key)(1) = dict(key)(1) + 1
            Else
                dict.Add key, Array(sumVal, 1)
            End If
        End If
    Next i

    ' 输出汇总表
    Dim wsOut As Worksheet
    On Error Resume Next
    Application.DisplayAlerts = False
    ThisWorkbook.Sheets("${p.outName}").Delete
    Application.DisplayAlerts = True
    On Error GoTo 0

    Set wsOut = ThisWorkbook.Sheets.Add
    wsOut.Name = "${p.outName}"

    wsOut.Range("A1").Value = "汇总维度"
    wsOut.Range("B1").Value = "汇总金额"
    wsOut.Range("C1").Value = "记录笔数"
    wsOut.Range("D1").Value = "占比"

    Dim totalSum As Double
    totalSum = 0
    For Each key In dict.Keys
        totalSum = totalSum + dict(key)(0)
    Next key

    i = 2
    For Each key In dict.Keys
        wsOut.Range("A" & i).Value = key
        wsOut.Range("B" & i).Value = dict(key)(0)
        wsOut.Range("C" & i).Value = dict(key)(1)
        If totalSum <> 0 Then
            wsOut.Range("D" & i).Value = dict(key)(0) / totalSum
        End If
        i = i + 1
    Next key

    ' 合计行
    wsOut.Range("A" & i).Value = "合计"
    wsOut.Range("B" & i).Value = totalSum
    wsOut.Range("C" & i).Value = WorksheetFunction.Sum(wsOut.Range("C2:C" & i - 1))
    wsOut.Range("D" & i).Value = 1

    ' 格式化
    wsOut.Range("A1:D1").Font.Bold = True
    wsOut.Range("B2:B" & i).NumberFormat = "#,##0.00"
    wsOut.Range("D2:D" & i).NumberFormat = "0.00%"
    wsOut.Range("A" & i & ":D" & i).Font.Bold = True
    wsOut.Range("A" & i & ":D" & i).Borders(xlEdgeTop).LineStyle = xlContinuous
    wsOut.Columns("A:D").AutoFit

    MsgBox "汇总完成！共 " & (i - 2) & " 个维度，合计金额 " & Format(totalSum, "#,##0.00"), vbInformation
End Sub`;
    }
  },

  mergeSheets: {
    name: '多表合并',
    desc: '将当前工作簿所有工作表数据合并到一张总表，自动加来源列。',
    filename: 'Merge_Sheets.bas',
    params: [
      { key: 'hasHeader', label: '每个Sheet有表头', type: 'select', options: ['是', '否'], default: '是', hint: '第一个Sheet的表头是否保留' },
      { key: 'sourceCol', label: '添加来源列', type: 'select', options: ['是', '否'], default: '是', hint: '在最前面加一列标注数据来自哪个Sheet' },
    ],
    generate: (p) => {
      const skipHeader = p.hasHeader === '是' ? '2' : '1';
      const hasSource = p.sourceCol === '是';
      return `Sub 多表合并到总表()
    ' 生成时间: ${new Date().toLocaleString('zh-CN')}
    Dim ws As Worksheet
    Dim wsOut As Worksheet
    Dim lastRow As Long, lastCol As Long
    Dim outRow As Long, i As Long, j As Long
    Dim sheetCount As Integer
    
    ' 创建总表
    On Error Resume Next
    Application.DisplayAlerts = False
    ThisWorkbook.Sheets("总表").Delete
    Application.DisplayAlerts = True
    On Error GoTo 0
    
    Set wsOut = ThisWorkbook.Sheets.Add(Before:=ThisWorkbook.Sheets(1))
    wsOut.Name = "总表"
    outRow = 1
    sheetCount = 0
    
    ' 遍历每个工作表
    For Each ws In ThisWorkbook.Sheets
        If ws.Name <> "总表" Then
            lastRow = ws.Cells(ws.Rows.Count, 1).End(xlUp).Row
            lastCol = ws.Cells(1, ws.Columns.Count).End(xlToLeft).Column
            
            If lastRow >= ${skipHeader} Then
                sheetCount = sheetCount + 1
                
                ' 第一个Sheet写表头
                If sheetCount = 1 Then
                    ${hasSource ? 'wsOut.Cells(1, 1).Value = "来源表"\n                    For j = 1 To lastCol\n                        wsOut.Cells(1, j + 1).Value = ws.Cells(1, j).Value\n                    Next j' : 'For j = 1 To lastCol\n                        wsOut.Cells(1, j).Value = ws.Cells(1, j).Value\n                    Next j'}
                    outRow = 2
                End If
                
                ' 复制数据
                For i = ${skipHeader} To lastRow
                    ${hasSource ? 'wsOut.Cells(outRow, 1).Value = ws.Name\n                    For j = 1 To lastCol\n                        wsOut.Cells(outRow, j + 1).Value = ws.Cells(i, j).Value\n                    Next j' : 'For j = 1 To lastCol\n                        wsOut.Cells(outRow, j).Value = ws.Cells(i, j).Value\n                    Next j'}
                    outRow = outRow + 1
                Next i
            End If
        End If
    Next ws
    
    wsOut.Columns.AutoFit
    MsgBox "合并完成！共 " & sheetCount & " 个Sheet，" & (outRow - 1) & " 行数据", vbInformation
End Sub`;
    }
  },

  splitByColumn: {
    name: '按列拆分',
    desc: '按指定列的值，将数据拆分到多个工作表，每个值一个Sheet。',
    filename: 'Split_By_Column.bas',
    params: [
      { key: 'sheetName', label: '数据表名称', type: 'text', default: 'Sheet1', hint: '待拆分的工作表' },
      { key: 'splitCol', label: '拆分依据列', type: 'text', default: 'B', hint: '如 B 列，按这列的值拆分' },
      { key: 'startRow', label: '数据起始行', type: 'number', default: 2, hint: '通常从第2行开始' },
      { key: 'headerRow', label: '表头行号', type: 'number', default: 1, hint: '表头所在行' },
    ],
    generate: (p) => {
      return `Sub 按列拆分工作表()
    ' 生成时间: ${new Date().toLocaleString('zh-CN')}
    Dim ws As Worksheet
    Dim wsOut As Worksheet
    Dim lastRow As Long, lastCol As Long
    Dim i As Long, outRow As Long
    Dim splitVal As String
    Dim dict As Object
    
    Set ws = ThisWorkbook.Sheets("${p.sheetName}")
    lastRow = ws.Cells(ws.Rows.Count, "${p.splitCol}").End(xlUp).Row
    lastCol = ws.Cells(${p.headerRow}, ws.Columns.Count).End(xlToLeft).Column
    
    Set dict = CreateObject("Scripting.Dictionary")
    
    ' 清除旧的拆分Sheet
    Application.DisplayAlerts = False
    Dim s As Worksheet
    For Each s In ThisWorkbook.Sheets
        If Left(s.Name, 4) = "拆分_" Then s.Delete
    Next s
    Application.DisplayAlerts = True
    
    ' 遍历数据
    For i = ${p.startRow} To lastRow
        splitVal = Trim(ws.Range("${p.splitCol}" & i).Value)
        If splitVal <> "" Then
            ' 清理文件名非法字符
            splitVal = Replace(Replace(Replace(splitVal, "/", "_"), "\\", "_"), "?", "_")
            
            If Not dict.Exists(splitVal) Then
                ' 创建新Sheet
                Set wsOut = ThisWorkbook.Sheets.Add(After:=ThisWorkbook.Sheets(ThisWorkbook.Sheets.Count))
                wsOut.Name = "拆分_" & Left(splitVal, 20)
                
                ' 复制表头
                ws.Rows(${p.headerRow}).Copy wsOut.Rows(1)
                dict.Add splitVal, wsOut.Name
            End If
            
            ' 复制数据行
            ws.Rows(i).Copy ThisWorkbook.Sheets(dict(splitVal)).Rows(ThisWorkbook.Sheets(dict(splitVal)).Cells(ThisWorkbook.Sheets(dict(splitVal)).Rows.Count, 1).End(xlUp).Row + 1)
        End If
    Next i
    
    MsgBox "拆分完成！共 " & dict.Count & " 个分组", vbInformation
End Sub`;
    }
  },

  markDuplicates: {
    name: '去重标记',
    desc: '按指定列标记重复数据，重复行标黄色，保留首次出现。',
    filename: 'Mark_Duplicates.bas',
    params: [
      { key: 'sheetName', label: '数据表名称', type: 'text', default: 'Sheet1', hint: '待处理的工作表' },
      { key: 'dupCol', label: '判断重复的列', type: 'text', default: 'A', hint: '如 A 列，按这列判断重复' },
      { key: 'startRow', label: '数据起始行', type: 'number', default: 2, hint: '通常从第2行开始' },
    ],
    generate: (p) => {
      return `Sub 标记重复数据()
    ' 生成时间: ${new Date().toLocaleString('zh-CN')}
    Dim ws As Worksheet
    Dim lastRow As Long, i As Long
    Dim dict As Object
    Dim cellVal As String
    Dim dupCount As Long
    
    Set ws = ThisWorkbook.Sheets("${p.sheetName}")
    lastRow = ws.Cells(ws.Rows.Count, "${p.dupCol}").End(xlUp).Row
    
    Set dict = CreateObject("Scripting.Dictionary")
    dupCount = 0
    
    ' 清除原有颜色
    ws.Range("${p.dupCol}${p.startRow}:${p.dupCol}" & lastRow).Interior.ColorIndex = xlNone
    
    For i = ${p.startRow} To lastRow
        cellVal = Trim(ws.Range("${p.dupCol}" & i).Value)
        If cellVal <> "" Then
            If dict.Exists(cellVal) Then
                ' 重复，标黄色
                ws.Range("${p.dupCol}" & i).Interior.Color = RGB(255, 235, 156)
                dupCount = dupCount + 1
            Else
                dict.Add cellVal, i
            End If
        End If
    Next i
    
    MsgBox "标记完成！共发现 " & dupCount & " 条重复记录（已标黄）", vbInformation
End Sub`;
    }
  },

  batchFormat: {
    name: '批量格式',
    desc: '批量设置数字格式、边框、对齐，统一表格样式。',
    filename: 'Batch_Format.bas',
    params: [
      { key: 'sheetName', label: '数据表名称', type: 'text', default: 'Sheet1', hint: '待格式化的工作表' },
      { key: 'amountCol', label: '金额列', type: 'text', default: 'D', hint: '如 D 列，设置千分位格式' },
      { key: 'startRow', label: '表头行号', type: 'number', default: 1, hint: '表头所在行' },
      { key: 'endCol', label: '最后一列', type: 'text', default: 'F', hint: '如 F 列，到这列为止加边框' },
    ],
    generate: (p) => {
      return `Sub 批量设置表格格式()
    ' 生成时间: ${new Date().toLocaleString('zh-CN')}
    Dim ws As Worksheet
    Dim lastRow As Long
    Dim rng As Range
    
    Set ws = ThisWorkbook.Sheets("${p.sheetName}")
    lastRow = ws.Cells(ws.Rows.Count, 1).End(xlUp).Row
    
    ' 1. 金额列设置千分位格式
    ws.Range("${p.amountCol}${p.startRow + 1}:${p.amountCol}" & lastRow).NumberFormat = "#,##0.00"
    
    ' 2. 表头样式
    With ws.Range("A${p.startRow}:${p.endCol}${p.startRow}")
        .Font.Bold = True
        .Interior.Color = RGB(219, 234, 254)

    End With
    
    ' 3. 全表加边框
    Set rng = ws.Range("A${p.startRow}:${p.endCol}" & lastRow)

    rng.Borders(xlInsideHorizontal).LineStyle = xlContinuous

    name: '金额大写',
    desc: '将数字金额转换为中文大写金额（壹仟贰佰元整），用于报销单、支票。',
    filename: 'Amount_To_Chinese.bas',
    params: [
      { key: 'sourceCol', label: '数字金额列', type: 'text', default: 'D', hint: '如 D 列，存放数字金额' },
      { key: 'targetCol', label: '结果输出列', type: 'text', default: 'E', hint: '如 E 列，输出中文大写' },
      { key: 'startRow', label: '数据起始行', type: 'number', default: 2, hint: '通常从第2行开始' },
    ],
    generate: (p) => {
      return `Sub 金额转中文大写()
    ' 生成时间: ${new Date().toLocaleString('zh-CN')}
    Dim ws As Worksheet
    Dim lastRow As Long, i As Long
    Dim amount As Double
    
    Set ws = ActiveSheet
    lastRow = ws.Cells(ws.Rows.Count, "${p.sourceCol}").End(xlUp).Row
    
    ' 写表头
    ws.Range("${p.targetCol}1").Value = "中文大写金额"
    
    For i = ${p.startRow} To lastRow
        amount = Val(ws.Range("${p.sourceCol}" & i).Value)
        ws.Range("${p.targetCol}" & i).Value = NumToChinese(amount)
    Next i
    
    MsgBox "转换完成！共 " & (lastRow - ${p.startRow} + 1) & " 行", vbInformation
End Sub

Function NumToChinese(ByVal n As Double) As String
    ' 数字转中文大写金额
    Dim digits As String, units As String, bigUnits As String
    Dim intPart As Long, decPart As Integer
    Dim s As String, i As Integer, d As Integer
    Dim result As String
    
    digits = "零壹贰叁肆伍陆柒捌玖"
    units = "分角元拾佰仟万拾佰仟亿拾佰仟"
    
    intPart = Int(n)
    decPart = Round((n - intPart) * 100, 0)
    
    If intPart = 0 Then
        result = "零元"
    Else
        s = CStr(intPart)
        For i = 1 To Len(s)
            d = CInt(Mid(s, i, 1))
            result = result & Mid(digits, d + 1, 1) & Mid(units, Len(s) - i + 3, 1)
        Next i
    End If
    
    ' 处理小数
    If decPart = 0 Then
        result = result & "整"
    Else
        result = result & Mid(digits, Int(decPart / 10) + 1, 1) & "分"
        result = result & Mid(digits, (decPart Mod 10) + 1, 1) & "角"
    End If
    
    NumToChinese = result
End Function`;
    }
  }
};

// ===== 状态 =====
let currentScene = 'voucher';

// ===== 渲染场景列表 =====
function renderSceneList() {
  const container = document.getElementById('sceneList');
  const searchVal = document.getElementById('sceneSearch').value.toLowerCase();
  container.innerHTML = '';
  let count = 0;
  Object.entries(SCENES).forEach(([key, scene]) => {
    if (searchVal && !scene.name.toLowerCase().includes(searchVal) && !scene.desc.toLowerCase().includes(searchVal)) return;
    count++;
    const item = document.createElement('div');
    item.className = 'scene-item' + (key === currentScene ? ' active' : '');
    item.innerHTML = `<div class="name">${scene.name}</div><div class="desc">${scene.desc.slice(0, 18)}...</div>`;
    item.onclick = () => { currentScene = key; renderSceneList(); renderParams(); };
    container.appendChild(item);
  });
  if (count === 0) {
    container.innerHTML = '<div style="padding:20px;text-align:center;color:#999;font-size:13px;">未找到匹配场景</div>';
  }
}

// ===== 下载功能 =====
function downloadCode() {
  const code = document.getElementById('codeArea').textContent;
  if (!code || code.includes('选择左侧场景')) {
    alert('请先生成代码');
    return;
  }
  const filename = SCENES[currentScene].filename;
  const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

// ===== 渲染参数表单 =====
function renderParams() {
  const scene = SCENES[currentScene];
  document.getElementById('sceneName').textContent = scene.name;
  document.getElementById('sceneDesc').textContent = scene.desc;
  document.getElementById('codeFilename').textContent = "' " + scene.filename;

  const form = document.getElementById('paramForm');
  form.innerHTML = '';

  scene.params.forEach((param, idx) => {
    const group = document.createElement('div');
    group.className = 'form-group';

    const label = document.createElement('label');
    label.innerHTML = `${param.label}<span class="hint">${param.hint || ''}</span>`;

    let input;
    if (param.type === 'select') {
      input = document.createElement('select');
      param.options.forEach((opt, i) => {
        const option = document.createElement('option');
        option.value = opt;
        option.textContent = opt;
        if (i === param.default) option.selected = true;
        input.appendChild(option);
      });
    } else {
      input = document.createElement('input');
      input.type = param.type === 'number' ? 'number' : 'text';
      input.value = param.default;
    }
    input.id = 'param_' + param.key;

    group.appendChild(label);
    group.appendChild(input);
    form.appendChild(group);
  });
}

// ===== 生成代码 =====
function generateCode() {
  const scene = SCENES[currentScene];
  const params = {};
  scene.params.forEach(p => {
    const el = document.getElementById('param_' + p.key);
    params[p.key] = el.value;
  });

  const code = scene.generate(params);
  document.getElementById('codeArea').textContent = code;
}

// ===== 复制代码 =====
function copyCode() {
  const code = document.getElementById('codeArea').textContent;
  if (!code || code.includes('选择左侧场景')) return;

  navigator.clipboard.writeText(code).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '已复制';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '复制代码';
      btn.classList.remove('copied');
    }, 2000);
  });
}

renderSceneList();
renderParams();
