<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财务工具箱</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='15' fill='%2360a5fa'/><text x='50' y='68' font-size='45' text-anchor='middle' fill='%23ffffff' font-family='monospace'>$</text></svg>">
<style>
  :root {
    --primary: #3b82f6;
    --primary-light: #93c5fd;
    --accent: #60a5fa;
    --bg: #f0f9ff;
    --surface: #ffffff;
    --border: #e0f2fe;
    --text: #0c4a6e;
    --text-secondary: #64748b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
    color: var(--text);
    padding: 40px 32px;
    text-align: center;
  }
  header h1 {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #0c4a6e;
  }
  header h1 span { color: #3b82f6; }

  .container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 48px 24px;
  }

  .tools-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  .tool-card {
    background: var(--surface);
    border-radius: 10px;
    padding: 28px 24px;
    border: 1px solid var(--border);
    transition: all 0.2s;
    text-decoration: none;
    color: var(--text);
    display: block;
  }
  .tool-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(59, 130, 246, 0.1);
    border-color: var(--accent);
  }

  .tool-icon {
    width: 44px;
    height: 44px;
    background: #e0f2fe;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    color: #3b82f6;
    font-size: 16px;
    font-weight: 700;
    font-family: "Consolas", monospace;
  }

  .tool-card h3 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .tool-card p {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.7;
  }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 12px;
    color: #aaa;
  }

  @media (max-width: 768px) {
    .tools-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<header>
  <h1>财务<span>工具箱</span></h1>
</header>

<div class="container">

  <div class="tools-grid">

    <a href="vba.html" class="tool-card">
      <div class="tool-icon">VBA</div>
      <h3>VBA代码生成器</h3>
      <p>凭证整理、流水核对、数据清洗、报表汇总，选场景填参数，生成VBA宏代码。</p>
    </a>

    <a href="formula.html" class="tool-card">
      <div class="tool-icon">fx</div>
      <h3>Excel公式生成器</h3>
      <p>VLOOKUP、XLOOKUP、SUMIFS、IF嵌套、日期与文本函数，常用公式一键生成。</p>
    </a>

    <a href="ratio.html" class="tool-card">
      <div class="tool-icon">%</div>
      <h3>财务比率分析</h3>
      <p>输入资产负债表与利润表数据，自动计算核心比率，生成行业对标分析报告。</p>
    </a>

  </div>

</div>

<footer>
  所有计算均在浏览器本地完成，数据不上传服务器
</footer>

</body>
</html>
